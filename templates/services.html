{% extends 'base.html' %}

{% block content %}
    <h1>Our Grooming Services</h1>
        {% for service in services %}
            <h2>{{ service.name }}</h2>
            <p>{{ service.description }}</p>
            <p>£{{ service.price }}</p>
            <p>{{ service.duration }} minutes</p>
        {% endfor %}
{% endblock %}
