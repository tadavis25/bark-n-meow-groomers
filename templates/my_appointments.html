{% extends 'base.html' %}

{% block content %}
    <h1>My Appointments</h1>
    <ul>
        {% for appointment in appointments %}
            <li>{{ appointment.service.name }} - {{appointment.appointment_date }} at {{appointment.appointment_time }}
                <a href="{% url 'edit_appointment' appointment.id %}" class="btn btn-primary">Edit Appointment</a>
                <form method="post" action="{% url 'cancel_appointment' appointment.id %}">
                    {% csrf_token %}
                    <button type="submit" onclick="return confirm('Are you sure you want to cancel this appointment?');">Cancel Appointment</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
